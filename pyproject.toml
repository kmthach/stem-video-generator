[tool.poetry]
name = "stem-video-generator"
version = "0.1.0"
description = "AI-powered STEM video generator turning topics into pedagogical animated videos using Gemini, Edge-TTS, Manim CE, and FFmpeg."
authors = ["HeyMac"]
readme = "README.md"
packages = [
    {include = "generator"},
    {include = "api"},
    {include = "db"},
    {include = "task_queue"},
]

[tool.poetry.dependencies]
python = ">=3.10, <3.15"
google-genai = ">=0.1.0"
edge-tts = ">=6.1.10"
manim = ">=0.18.0"
typer = {extras = ["all"], version = ">=0.9.0"}
rich = ">=13.7.0"
pydantic = ">=2.5.0"
pydantic-settings = ">=2.1.0"
python-dotenv = ">=1.0.0"
mutagen = ">=1.47.0"
aiofiles = ">=23.2.0"
fastapi = ">=0.110.0"
uvicorn = {extras = ["standard"], version = ">=0.28.0"}
redis = ">=5.0.0"
sqlalchemy = ">=2.0.0"
pymysql = ">=1.1.0"
cryptography = ">=42.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"
pytest-asyncio = ">=0.23.0"
httpx = ">=0.27.0"

[tool.poetry.scripts]
stem-video = "generator.main:cli"
stem-video-api = "api.app:start"
stem-video-worker = "task_queue.worker:start"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
